
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>VISUALRIF</title>
      
      <!-- Preconnect to external resources -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link rel="preconnect" href="https://www.youtube.com" />
      <link rel="preconnect" href="https://i.ytimg.com" />
      
      <!-- DNS prefetch for faster resolution -->
      <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
      <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
      <link rel="dns-prefetch" href="https://www.youtube.com" />
      
      <!-- Preload critical fonts with font-display swap -->
      <link 
        rel="preload" 
        href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Barlow:wght@400;500;600&family=Lato:wght@300;400&display=swap" 
        as="style"
        onload="this.onload=null;this.rel='stylesheet'"
      />
      <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Barlow:wght@400;500;600&family=Lato:wght@300;400&display=swap" />
      </noscript>
      
      <!-- Meta for performance -->
      <meta name="theme-color" content="#020404" />
      <meta name="color-scheme" content="dark" />
      
      <!-- Critical CSS for initial render -->
      <style>
        html, body { 
          height: 100%; 
          margin: 0; 
          background-color: #020404;
          color: #ffffff;
        }
        #root { 
          height: 100%; 
        }
        /* Font fallback to prevent layout shift */
        body {
          font-family: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        /* Loading state */
        .app-loading {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background: #020404;
        }
        .app-loading::after {
          content: '';
          width: 40px;
          height: 40px;
          border: 2px solid #50C1BA;
          border-top-color: transparent;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </head>

    <body>
      <div id="root"><div class="app-loading"></div></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
